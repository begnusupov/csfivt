<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">

  <link rel="stylesheet" href="style.css">

<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/bracket">
        <svg class="ball" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#0b0b0b" stroke="#2a2f36"/><circle cx="16" cy="14" r="7" fill="#fff"/><text x="16" y="17.6" font-size="9" font-family="Inter,Arial" font-weight="700" text-anchor="middle" fill="#0b0b0b">8</text></svg>
        <span class="brand-text">
          <span class="brand-title" id="brandTitle">Турнир по бильярду</span>
          <span class="brand-sub" id="brandSub">Double elimination · 10 игроков</span>
        </span>
      </a>
      <div class="userbox" id="userbox"></div>
    </div>
    <nav class="tabs" id="tabs">
      <a href="#/bracket" data-route="bracket">Сетка</a>
      <a href="#/pickem" data-route="pickem">Мой пикем</a>
      <a href="#/leaderboard" data-route="leaderboard">Таблица</a>
      <a href="#/rules" data-route="rules">Правила</a>
      <a href="#/admin" data-route="admin" id="adminTab" hidden>Организатор</a>

  </header>

  <main id="app" class="container">
    <div class="loading">Загрузка…</div>
  </main>

    <div class="modal-backdrop" data-close></div>

      <button class="modal-x" data-close aria-label="Закрыть">×</button>
      <div id="modalBody"></div>

  </div>

  <div class="toasts" id="toasts"></div>

  <script src="config.js"></script>
  <script src="app.js"></script>

</html>
